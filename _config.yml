# The site's name and its default description. `title` is what a search result
# is attributed to and what the browser tab reads; `description` is the fallback
# for any page that does not supply its own. Lead with the words that matter —
# search engines cut it around 160 characters and preview cards cut it sooner.
title: "Cris Souza"
description: "PhD student, AI and IS researcher, tech leader, traveler. Stories, publications, and projects by Cris Souza."
# The site now lives at the root of crissouza.org, so there is no base path.
# These two values are the ONLY place the address is declared — every absolute
# URL is built from them. Do not add --baseurl to the deploy workflow: a
# command-line flag overrides this file and the override is invisible.
baseurl: ""
permalink: "/stories/:year/:month/:day/:title/"

# How many entries the home page "what's new" widget shows at once.
# Jekyll reads this file only at startup, so restart the local server after
# changing it — a rebuild alone will not pick it up.
updates_limit: 4
url: "https://crissouza.org"

# Social links moved to _data/social.yml, where the footer actually reads them.
# They sat here unused while the footer hardcoded its own copy, so editing this
# file changed nothing on the site. Content belongs in _data/ — and unlike this
# file, _data/ is picked up by a rebuild without restarting the local server.

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "story"

exclude:
  - Gemfile
  - Gemfile.lock
  - specs
  - .specify
  - .claude
  - CLAUDE.md
  # Authoring helpers — templates to copy and a checker to run. They are for
  # writing content, not part of the site, so they must not be published.
  - tools
  # Repository documentation. These are for whoever works on the site, not for
  # visitors — without this they publish as pages and would be indexed.
  - README.md
  - BACKLOG.md
