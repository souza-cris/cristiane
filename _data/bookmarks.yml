- title: "METR"
  type: "organization"
  topicTags:
    - "AI"
    - "evaluation"
    - "safety"
  whyItMatters: "Independent evaluation by a nonprofit that takes no payment for it. A counterweight to labs grading their own homework."
  keyTakeaway: "Their time horizon metric measures how long a task a model can finish reliably, doubling roughly every seven months. Same group ran the 2025 trial where experienced developers were 19% slower with AI while believing they were faster."
  link: "https://metr.org/"
  addedDate: "2026-07-26"
  source: "METR"

- title: "OpenAI Academy"
  type: "course"
  topicTags:
