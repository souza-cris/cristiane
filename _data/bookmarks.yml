- title: "Attention Is All You Need"
  type: "paper"
  topicTags:
    - "AI"
    - "research"
    - "foundations"
  whyItMatters: "The architecture under everything current. Read it once and the vocabulary in every later paper becomes legible."
  keyTakeaway: "Vaswani et al., 2017. Drop recurrence and convolution, keep attention. Trained faster, parallelized better, beat the state of the art in translation."
  link: "https://papers.nips.cc/paper_files/paper/2017/hash/3f5ee243547dee91fbd053c1c4a845aa-Abstract.html"
  addedDate: "2026-07-26"
  source: "Vaswani et al., NeurIPS 2017"

- title: "Managing Artificial Intelligence"
  type: "paper"
  topicTags:
    - "AI"
    - "management"
    - "governance"
    - "research"
  whyItMatters: "Management framing, not technical. Useful when the question is how an organization governs AI rather than how a model works."
  keyTakeaway: "Three interlocking properties to manage: autonomy, learning, inscrutability. The frontier keeps moving, so today's AI becomes tomorrow's ordinary software."
  link: "https://misq.umn.edu/misq/article/45/3/1433/1890/Managing-Artificial-Intelligence1"
  addedDate: "2026-07-26"
  source: "Berente, Gu, Recker & Santhanam, MIS Quarterly 45(3), 2021"
