- title: "Anthropic Economic Index: AI's impact on software development"
  type: "report"
  topicTags:
    - "AI"
    - "software development"
    - "economics"
  whyItMatters: "Measured use, not opinion. 500k real coding conversations, split by whether the human stayed in the loop or handed the task over. It gives you a vocabulary (automation vs augmentation) for deciding how much of your own work to delegate."
  keyTakeaway: "79% of Claude Code conversations were automation, against 49% on the chat interface. Front-end work dominates, which suggests UI-heavy roles feel the shift first."
  link: "https://www.anthropic.com/research/impact-software-development"
  addedDate: "2026-04-28"
  source: "Anthropic"

- title: "APEX Benchmarks"
  type: "tool"
  topicTags:
    - "AI"
    - "benchmarks"
    - "evaluation"
  whyItMatters: "Most benchmarks test exam questions. APEX tests paid professional work: investment banking, corporate law, consulting, medicine, software engineering, with tasks written and graded by people who do those jobs."
  keyTakeaway: "On long multi-hour agent tasks the leaders sit near 43%. Impressive on single-turn text, nowhere near reliable on real workflows."
  link: "https://www.mercor.com/apex/"
  addedDate: "2026-07-26"
  source: "Mercor"

- title: "Centaur Evaluations"
  type: "project"
  topicTags:
    - "AI"
    - "benchmarks"
    - "evaluation"
    - "research"
  whyItMatters: "Names the blind spot in every leaderboard: the model is scored alone, without the person who will actually use it. Measure imitation and you build for replacement by default."
  keyTakeaway: "The unit of measurement should be the human plus AI team. Report human-only, AI-only, and centaur performance, and treat human minutes and tokens as separate inputs."
  link: "https://digitaleconomy.stanford.edu/project/ai-centaur-benchmarks/"
  addedDate: "2026-07-26"
  source: "Stanford Digital Economy Lab"

