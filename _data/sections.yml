# The site's sections, in navigation order. This one file drives BOTH the top
# navigation and the side navigation, so the two can never drift apart.
#
# label : the link text — lowercase, matching the site's voice
# url   : the page's canonical address, WITH its trailing slash. This must match
#         the permalink exactly — writing "/stories" makes every click on that
#         link cost a 301 redirect. section-links.html compares this to page.url
#         directly and must NOT append a slash of its own.
# match : how this link decides it is the visitor's current section
#         exact  — only that page itself
#         prefix — that page and anything beneath it, so an individual story
#                  or a filter page still marks its section as current
#
# Home is deliberately absent. The "main" brand link in the top navigation
# returns there, and the side navigation does not render on home at all.
#
# To add a section: add a block here, then create the page. Both navigations
# pick it up with no template change.

- label: "journey"
  url: "/journey/"
  match: "exact"

- label: "stories"
  url: "/stories/"
  match: "prefix"

- label: "research"
  url: "/research/"
  match: "exact"

- label: "bookmarks"
  url: "/bookmarks/"
  match: "prefix"

- label: "contact"
  url: "/contact/"
  match: "exact"
