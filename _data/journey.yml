# The journey timeline, oldest first — the page renders them left to right.
#
# category : academia | industry  (sets the dot color)
# label    : the short line shown on the track — keep it to a few words
# org      : school, company or community
# short    : 1-3 letters shown in the circle until a logo file is added
# logo     : optional path under /assets/img/logos/, e.g. "dell.svg".
#            Leave as "" and the `short` initials are shown instead.
# url      : optional link to the organization's own site. Set it and the logo
#            becomes clickable, opening in a new tab. Leave it out and the logo
#            renders as plain artwork — no code change needed either way.
# flag     : country flag emoji
# place    : city, country — shown under the label
#
# `title` and `note` are shown ONLY when a visitor opens a stop. They hold the
# longer version of each milestone.
#
# period   : optional, e.g. "2019–2022". Also shown ONLY inside an opened stop,
#            never on the track itself. Leave it out and nothing renders — add
#            it to any milestone later and it appears with no code change.
#
# No years on the track — the order on this page is the story.

